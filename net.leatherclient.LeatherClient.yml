app-id: net.leatherclient.LeatherClient
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: leather-client
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-data/LeatherClient:create
  - --talk-name=org.kde.StatusNotifierWatcher
  - --env=LD_LIBRARY_PATH=/app/lib
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1
modules:
  - name: leather-client
    buildsystem: simple
    build-commands:
      - install -Dm755 leather-client /app/bin/leather-client
      - mkdir -p '/app/lib/Leather Client'
      - cp -a libs/. /app/lib/
      - cp -a resources/. '/app/lib/Leather Client/'
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/net.leatherclient.LeatherClient.png
      - install -Dm644 net.leatherclient.LeatherClient.desktop /app/share/applications/net.leatherclient.LeatherClient.desktop
      - install -Dm644 net.leatherclient.LeatherClient.metainfo.xml /app/share/metainfo/net.leatherclient.LeatherClient.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/Leather-Client/version/releases/download/v1.1.4/leather-client_1.1.4_amd64.AppImage.tar.gz
        sha256: sha256:7cdc9f2ac2c570ca609e490af45476c1c868db97bdee59e71c94ec32b8e630c0
      - type: file
        url: https://github.com/Leather-Client/version/releases/download/v1.1.4/net.leatherclient.LeatherClient.desktop
        sha256: sha256:f0fe0b063cee3c0604747d5d731357f6cc2e990487dded56a306adf8b10bd3bc
      - type: file
        url: https://github.com/Leather-Client/version/releases/download/v1.1.4/net.leatherclient.LeatherClient.metainfo.xml
        sha256: sha256:958b68c5cf39c39ffa183663c7b7d1a61463124448a401543fdc7687db2a3be2
